# Hooks run the tools pinned (with hashes) in requirements-dev.txt from the
# active virtual environment, so hook versions never drift from CI.
# Activate .venv before committing:  .venv\Scripts\Activate.ps1
repos:
  - repo: local
    hooks:
      - id: detect-secrets
        name: detect-secrets
        entry: python -m detect_secrets.pre_commit_hook --baseline .secrets.baseline
        language: system
        exclude: ^\.secrets\.baseline$
      - id: ruff-check
        name: ruff check
        entry: python -m ruff check --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: python -m ruff format --check --force-exclude
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: python -m mypy tyn tests scripts
        language: system
        pass_filenames: false
        types: [python]
      - id: no-em-dash
        name: no em dashes
        entry: '\u2014'
        language: pygrep
        types: [text]
